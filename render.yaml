services:
  - type: web
    name: loaniq
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/seed_v2.py
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
